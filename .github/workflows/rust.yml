name: rust
on:
  push:
    branches: ["rust-main", "feat/**", "spike/**"]
  pull_request:
    paths: ["crates/**", "launcher/src-tauri/**", "Cargo.*", ".github/workflows/rust.yml"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The launcher crate is Tauri/Windows-focused and needs webkit system libs;
      # the community CLI story on Linux is the three crates — test exactly those.
      - run: cargo build -p dml-core -p dml-wow -p dml-wow-cli --locked
      # --nocapture on purpose: the parity suites announce why they skip with
      # eprintln!, and cargo swallows that for PASSING tests. Without it a suite
      # that skips for a BROKEN reason (as every one of them did on Linux until
      # the tool gates were made platform-honest) is indistinguishable in the log
      # from one that ran. The skip lines are the only evidence of which suites
      # this job actually exercises.
      - run: cargo test -p dml-core -p dml-wow -p dml-wow-cli --locked -- --nocapture
      # The shipped artifact. The Windows installer bundles this binary and
      # provision.rs deploys it into the distro, so this job is no longer
      # advisory — a red linux job means there is nothing to ship.
      - run: cargo build -p dml-wow-cli --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: dml-wow-linux-x86_64
          path: target/release/dml-wow
          if-no-files-found: error
