[package]
name = "dml-wow"
version = "0.1.0"
description = "WoW (AzerothCore + playerbots) game library for DML"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
dml-core = { path = "../dml-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direct MySQL reader (`db`, `pages`, `stats`, `paperdoll`, `iteminfo`,
# `backup`, `restore`, `modmgr`, `moduletail`, `destructive`). Pure-Rust
# build: `minimal-rust` swaps flate2's zlib C backend for the Rust one, and NO
# TLS feature is enabled (the launcher connects to Docker Desktop's DB over
# loopback, unencrypted) so there is no OpenSSL/native-tls C dependency to
# satisfy on Windows. Feature set copied verbatim from the launcher manifest
# it moved out of (cargo-workspace refactor, Task 7).
mysql = { version = "28", default-features = false, features = ["minimal-rust", "derive", "buffer-pool"] }
# SOAP transport (`soap`), the public-IP probe (`lanip`) and the icon fetch
# (`iteminfo`). Same feature set the launcher uses (it keeps its own copy for
# `zam.rs`).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# item-info/entity-info icon bytes -> icon_b64 (`iteminfo`).
base64 = "0.22.1"
# Backup create/validate (`backup`, `restore`): gzip the mysqldump stream +
# gzip-test/decompress a saved backup for validation.
flate2 = "1"
