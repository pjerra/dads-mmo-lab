[package]
name = "launcher"
version = "0.1.0"
description = "DML Launcher — graphical front door to the Dad's MMO Lab tooling"
authors = ["Dad's MMO Lab contributors"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_yaml_ng = "0.10.0"
# Native-mode direct MySQL reader (spike). Pure-Rust build: `minimal-rust` swaps
# flate2's zlib C backend for the Rust one, and NO TLS feature is enabled (the
# launcher connects to Docker Desktop's DB over loopback, unencrypted) so there
# is no OpenSSL/native-tls C dependency to satisfy on Windows.
mysql = { version = "28", default-features = false, features = ["minimal-rust", "derive", "buffer-pool"] }
# item-info/entity-info icon bytes -> icon_b64 (dml::iteminfo, task D1b). Pinned
# to the version already resolved transitively (reqwest/mysql), so adding it
# as a direct dep doesn't shift anything else in Cargo.lock.
base64 = "0.22.1"
# Backup create/validate (dml::backup, Chunk 2 task C2a): gzip the mysqldump
# stream + gzip-test/decompress a saved backup for validation. Already
# resolved transitively (mysql's minimal-rust feature pulls flate2's pure-Rust
# `rust_backend`/miniz_oxide, no OpenSSL/C dep), so making it a direct dep
# doesn't shift anything else in Cargo.lock.
flate2 = "1"
# module repair's `mark` mode (dml::moduletail, Chunk 5 Part 5b): hashes a
# module's .sql file the SAME way the bash oracle's `sha1sum` does, so the
# `updates` tracking row's hash matches what AzerothCore's own db-import
# would have written. Pure Rust, no C/OpenSSL dependency.
sha1 = "0.10"

