# MIGRATED WoW-playerbots stack for Docker Desktop — the starting point for
# import-to-desktop.sh, and the exact shape that script validates.
#
# PROVENANCE: copied from the server the 2026-07-24 live migration produced and
# that still runs today — C:\Users\perzi\dml-native\wow-server-playerbots\
# docker-compose.yml (2505 characters, 500 bots online, real client login) —
# with only the image tag turned into a variable.
#
# THIS IS NOT ../wow-playerbots/docker-compose.yml. That file is the CLEAN
# stock-image stack: no host binds, and deliberately no
# AC_PLAYERBOTS_DATABASE_INFO, because the published acore image has no
# playerbots module compiled in. A MIGRATION is the opposite case — it carries
# the user's OWN images (docker save/load), so it needs:
#
#   * ./env/dist/etc  bound back out — the exported config tree is staged there
#     and `dml wow config` / the launcher's Settings page read and WRITE those
#     .conf files. Without the bind the container reads the image's built-in
#     .conf.dist defaults instead, and every setting the user saves does
#     nothing while appearing to save.
#   * ./env/dist/logs bound back out — AC_LOGS_DIR otherwise writes inside the
#     container only.
#   * AC_PLAYERBOTS_DATABASE_INFO — the fourth DB the exported world carries
#     (acore_playerbots). A playerbots worldserver with the other three wired
#     and this one missing boots and is wrong.
#   * ./modules:/azerothcore/modules — lives in docker-compose.override.yml
#     (the dml config system owns that file). With
#     Playerbots.Updates.EnableDatabases=1 the updater scans
#     /azerothcore/modules/mod-playerbots at boot and SHUTS THE WORLDSERVER
#     DOWN if it is absent: the only boot failure of the live migration.
#
# Copy this file next to the export as docker-compose.yml, then merge the
# exported conf/docker-compose.override.yml.orig into docker-compose.override.yml.
#
# ${IMAGE_TAG:-master} MUST resolve to the tag the export saved (the export's
# DML_IMAGE_TAG, default master) — compose silently PULLS a missing tag from
# Docker Hub, which for these image names is the stock non-playerbots build.
#
# Ports match the distro server's defaults: run one server or the other, never
# both. The container names MUST stay ac-* — every `dml wow` arm addresses
# containers by exactly those names (`docker exec ac-database ...`).
name: dml-wow-native

services:
  ac-database:
    container_name: ac-database
    image: mysql:8.4
    networks: [ac-network]
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40

  ac-db-import:
    container_name: ac-db-import
    image: acore/ac-wotlk-db-import:${IMAGE_TAG:-master}
    networks: [ac-network]
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_characters"
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_playerbots"
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy

  ac-client-data-init:
    container_name: ac-client-data-init
    image: acore/ac-wotlk-client-data:${IMAGE_TAG:-master}
    volumes:
      - client-data:/azerothcore/env/dist/data

  ac-authserver:
    container_name: ac-authserver
    image: acore/ac-wotlk-authserver:${IMAGE_TAG:-master}
    networks: [ac-network]
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
    ports:
      - "${AUTH_EXTERNAL_PORT:-3724}:3724"
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  ac-worldserver:
    container_name: ac-worldserver
    image: acore/ac-wotlk-worldserver:${IMAGE_TAG:-master}
    networks: [ac-network]
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Give the world time to save 1600+ bots + players on shutdown instead of
    # compose's 10s default SIGKILL.
    stop_grace_period: 5m
    environment:
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_characters"
      AC_PLAYERBOTS_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_playerbots"
      # Runtime settings (SOAP, bot population, rates) and the ./modules mount
      # live in docker-compose.override.yml — the dml config system owns that
      # file and rewrites it.
    ports:
      - "${WORLD_EXTERNAL_PORT:-8085}:8085"
      - "${SOAP_EXTERNAL_PORT:-7878}:7878"
    volumes:
      - ./env/dist/etc:/azerothcore/env/dist/etc
      - ./env/dist/logs:/azerothcore/env/dist/logs
      - client-data:/azerothcore/env/dist/data/:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully

networks:
  ac-network:

volumes:
  db-data:
  client-data:
