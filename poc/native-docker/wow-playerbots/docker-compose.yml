# Native WoW (AzerothCore + playerbots) stack for Docker Desktop on Windows.
# Spike: spike/docker-desktop-native.
#
# This is the REAL server stack — the same acore images the dml-arch server runs
# (ac-database / ac-db-import / ac-authserver / ac-worldserver / ac-client-data)
# — re-expressed to run DIRECTLY on Docker Desktop, with NO dml-arch distro and
# NO bash `dml`. It's what the launcher's NativeDocker backend drives.
#
# Differences from the distro's generated compose, and why:
#   * No `build:` sections — we PULL the published images, we don't compile.
#   * No host bind mounts of ./env/dist/etc or ./env/dist/logs. The distro server
#     mounts those so its module/playerbots config persists on the host; a fresh
#     native instance instead uses the images' built-in dist configs, and the
#     AC_*_DATABASE_INFO env vars (which override the .conf files) carry the DB
#     wiring. Bringing the configured server's OWN data/config across engines is
#     a separate migration step (documented in ../README.md) — this template
#     stands up a clean, real server, which is what an orchestration proof needs.
#   * Dropped ac-tools and ac-dev-server (profiled dev-only services).
#   * All data lives in named volumes, so the stack is self-contained: nothing
#     on the Windows host to prepare before `up`.
#
# The launcher pins the project name with `-p dml-wow-native`; volumes below are
# named so this stack never collides with the distro server's containers.
name: dml-wow-native

services:
  ac-database:
    container_name: dml-native-database
    image: mysql:8.4
    networks: [ac-network]
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40

  ac-db-import:
    container_name: dml-native-db-import
    image: acore/ac-wotlk-db-import:${IMAGE_TAG:-master}
    networks: [ac-network]
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_characters"
    depends_on:
      ac-database:
        condition: service_healthy

  ac-authserver:
    container_name: dml-native-authserver
    image: acore/ac-wotlk-authserver:${IMAGE_TAG:-master}
    networks: [ac-network]
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
    ports:
      - "${AUTH_EXTERNAL_PORT:-3724}:3724"
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  ac-client-data-init:
    container_name: dml-native-client-data
    image: acore/ac-wotlk-client-data:${IMAGE_TAG:-master}
    volumes:
      - client-data:/azerothcore/env/dist/data

  ac-worldserver:
    container_name: dml-native-worldserver
    image: acore/ac-wotlk-worldserver:${IMAGE_TAG:-master}
    networks: [ac-network]
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_auth"
      AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_world"
      AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DB_ROOT_PASSWORD:-password};acore_characters"
      # NB: no AC_PLAYERBOTS_DATABASE_INFO here — the published stock image has
      # no playerbots module compiled in, so this template boots a clean vanilla
      # server (review finding, 2026-07-24). The user's REAL playerbots build
      # travels via the migration path instead: docker save/load of their exact
      # locally-relevant images + DB restore + etc bind (see README increment 4)
      # — that stack keeps the playerbots env because its worldserver has the
      # module.
    ports:
      - "${WORLD_EXTERNAL_PORT:-8085}:8085"
      - "${SOAP_EXTERNAL_PORT:-7878}:7878"
    volumes:
      - client-data:/azerothcore/env/dist/data/:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully

networks:
  ac-network:

volumes:
  db-data:
  client-data:
